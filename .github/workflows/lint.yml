name: Lint

# Ported from mau-apps/.github/workflows/lint.yml. Reusable workflow, called
# from enem-landing-dev.yml/enem-landing-prod.yml.
on:
  workflow_call:

jobs:
  lint:
    name: Run lint checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Shared with test.yml/e2e.yml/build-push.yml via the same key (per
      # commit) - lets ESLint's Nx cache entries be reused across jobs in
      # the same pipeline run instead of recomputed independently.
      - name: Cache Nx computation cache
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-

      - name: Run ESLint
        run: yarn lint

      # Scoped per-app via Nx `lint:format` targets (apps/<app>/package.json),
      # same pattern as mau-apps - NOT a bare `prettier --check .`, which
      # would also scan infra/docs/config paths that aren't Prettier's
      # concern here.
      - name: Run Prettier
        run: yarn lint:format
