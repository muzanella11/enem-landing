name: E2E Tests

# Reusable workflow (workflow_call). Ported from
# mau-apps/.github/workflows/e2e.yml, adapted for this workspace's 5 apps
# (2 NestJS + 3 Nuxt) + 3 e2e suites instead of mau-apps' 14/9.
#
# "serverless" pattern, same as mau-apps' `yarn e2e:serverless` - build
# every app ONCE below, start real production servers by hand, then run
# `yarn e2e:serverless` (BASE_URL set per suite) so Playwright hits them
# directly instead of managing their lifecycle itself.
#
# This replaced an earlier version that let each suite's own
# playwright.config.mts `webServer` entries build + serve everything via
# Nx (see git history) - abandoned after two real failures reproduced
# both locally and in CI:
#   1. `@nx/playwright/plugin` adds a server's Nx target as a task
#      dependency whenever `reuseExistingServer` is truthy, and that task
#      just runs `nx run <project>:serve` with no port-probing - it
#      crashes with EADDRINUSE against anything already listening.
#      `reuseExistingServer: false` doesn't help either: Playwright then
#      refuses to start at all ("already used... set
#      reuseExistingServer:true"). Neither setting can coexist with a
#      server started outside Nx's own task graph.
#   2. Building 2-4 apps concurrently in dev mode (`nuxt dev` / NestJS
#      webpack dev build) inside `webServer` overloaded the 2-vCPU GH
#      Actions runner badly enough to hang past even a 180s timeout with
#      zero output (run 33492639964) - far worse than the ~15s this takes
#      on a local machine.
# Building once, sequentially, up front avoids both.
on:
  workflow_call:
    secrets:
      JWT_SECRET:
        required: true

jobs:
  e2e:
    name: Run e2e tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      TZ: UTC
      # NOTE on ACCOUNT_API_HOST/API_HOST/ACCOUNT_WEB_HOST below: unlike
      # compose.yml/compose.local.yml, these plain (non-NUXT_-prefixed)
      # names are correct HERE. All 5 servers run flat on this one runner
      # (not separate containers), so "localhost" is valid from every
      # process's perspective - these values match nuxt.config.ts's own
      # build-time fallback defaults exactly, so the plain env vars simply
      # make that intent explicit at build time rather than relying on the
      # fallback implicitly. No runtime NUXT_ override is needed because
      # nothing needs to differ between build time and run time here (that
      # only matters when build and run happen in different environments,
      # e.g. a Docker image built once and run against different hosts -
      # see the Dockerfile/compose.yml header comments for that case).
      #
      # Single connection-string DATABASE_URL per app (this workspace's
      # real convention, verified against each app's .env.example) - not
      # decomposed HOST/PORT/USERNAME/PASSWORD like mau-apps.
      DATABASE_URL_ACCOUNT_API: mysql://root:root@127.0.0.1:3306/enem_landing_account
      DATABASE_URL_API: mysql://root:root@127.0.0.1:3306/enem_landing_api
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      REDIS_TLS_ENABLED: "false"
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      ALLOW_SIGNUP: "false"
      ACCOUNT_API_HOST: http://localhost:3000
      API_HOST: http://localhost:3001
      ACCOUNT_WEB_HOST: http://localhost:8000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Shared with lint.yml/test.yml/build-push.yml via the same key (per
      # commit) - this job builds all 5 apps below, the biggest chunk of
      # e2e's runtime; build-push.yml's matrix rebuilds the (usually
      # fewer) affected apps for the SAME commit moments later in the same
      # pipeline run, so a warm cache here lets it reuse this output.
      - name: Cache Nx computation cache
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-

      - name: Create databases
        run: mysql -h 127.0.0.1 -u root -proot -e "CREATE DATABASE IF NOT EXISTS enem_landing_account; CREATE DATABASE IF NOT EXISTS enem_landing_api;"

      # Each e2e suite's own playwright.config.mts webServer entries start
      # these APIs via Nx (see header comment) - NOT covered by the
      # step-level `DATABASE_URL` env overrides below (those only apply to
      # migrations/seed, which run once here, not to whatever Nx launches
      # later during `yarn e2e`). Each app's own load-env.ts reads
      # `.env.local` via dotenv, which never overrides an already-set env
      # var, so this fills in DATABASE_URL for however Nx ends up invoking
      # these apps without needing to know every invocation path.
      - name: Write .env.local for API apps
        run: |
          echo "DATABASE_URL=$DATABASE_URL_ACCOUNT_API" > apps/enem-landing-account-api/.env.local
          echo "DATABASE_URL=$DATABASE_URL_API" > apps/enem-landing-api/.env.local

      # `sudo` resets PATH, dropping the Node 26 that actions/setup-node put
      # there from .nvmrc and falling back to the runner's older preinstalled
      # Node - which fails this repo's `engines.node >=26` in package.json.
      # Pass PATH through explicitly so sudo sees the same Node.
      #
      # All 3 browsers - every playwright.config.mts in this workspace
      # declares chromium/firefox/webkit projects and `yarn e2e:serverless`
      # runs all of them.
      - name: Install Playwright system dependencies
        run: sudo env "PATH=$PATH" yarn playwright install-deps chromium firefox webkit

      - name: Install Playwright browsers
        run: yarn playwright install chromium firefox webkit

      # Each app's own code reads plain `DATABASE_URL` (see
      # typeorm.config.ts / .env.example) - the job-level env above keeps
      # them apart as DATABASE_URL_ACCOUNT_API/DATABASE_URL_API since both
      # apps run in this same job, so each DB-touching step here remaps
      # back to DATABASE_URL, same pattern as migrate.yml/compose.yml.
      - name: Run account API migrations + seed
        env:
          DATABASE_URL: ${{ env.DATABASE_URL_ACCOUNT_API }}
        run: |
          yarn nx run enem-landing-account-api:migration:run
          yarn nx run enem-landing-account-api:seed

      - name: Run business API migrations
        env:
          DATABASE_URL: ${{ env.DATABASE_URL_API }}
        run: yarn nx run enem-landing-api:migration:run

      # `nx run <app>:prune` (not plain `build`) for the 2 NestJS apps -
      # this workspace resolves in-repo libs via Nx's prune-lockfile +
      # copy-workspace-modules executors (see Dockerfile's own header
      # comment for the full explanation) - `main.js` alone isn't runnable
      # without the pruned package.json/workspace_modules alongside it.
      - name: Build APIs
        run: |
          yarn nx run enem-landing-account-api:prune
          yarn nx run enem-landing-api:prune

      # `.nuxt/tsconfig*.json` is generated by `nuxi prepare`, which a plain
      # `nuxt build` also runs as its first phase - but the Vite/oxc
      # tsconfig lookup during `nx build` can resolve to the WRONG Nuxt
      # project's `.nuxt/tsconfig.json` when the other 2 apps haven't been
      # prepared yet (reproduced locally: building account-web alone on a
      # fresh checkout fails trying to load cms's .nuxt/tsconfig.json).
      # Preparing all 3 upfront removes the ambiguity.
      - name: Prepare Nuxt apps
        run: |
          npx nuxi prepare apps/enem-landing-account-web
          npx nuxi prepare apps/enem-landing-cms
          npx nuxi prepare apps/enem-landing-web

      - name: Build web apps
        run: |
          yarn nx build enem-landing-account-web
          yarn nx build enem-landing-cms
          yarn nx build enem-landing-web

      - name: Start all servers
        run: |
          nohup env DATABASE_URL="$DATABASE_URL_ACCOUNT_API" \
            node apps/enem-landing-account-api/dist/main.js \
            > /tmp/account-api.log 2>&1 &
          echo "enem-landing-account-api started (PID: $!)"

          nohup env DATABASE_URL="$DATABASE_URL_API" \
            node apps/enem-landing-api/dist/main.js \
            > /tmp/api.log 2>&1 &
          echo "enem-landing-api started (PID: $!)"

          nohup env NITRO_PORT=8000 \
            node apps/enem-landing-account-web/.output/server/index.mjs \
            > /tmp/account-web.log 2>&1 &
          echo "enem-landing-account-web started (PID: $!)"

          nohup env NITRO_PORT=4000 \
            node apps/enem-landing-cms/.output/server/index.mjs \
            > /tmp/cms.log 2>&1 &
          echo "enem-landing-cms started (PID: $!)"

          nohup env NITRO_PORT=8001 \
            node apps/enem-landing-web/.output/server/index.mjs \
            > /tmp/web.log 2>&1 &
          echo "enem-landing-web started (PID: $!)"

      - name: Wait for all servers
        run: >-
          npx wait-on
          http://localhost:3000/health
          http://localhost:3001/health
          http://localhost:8000
          http://localhost:4000
          http://localhost:8001
          --timeout 120000

      - name: Run e2e tests
        run: yarn e2e:serverless

      - name: Upload Playwright reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            apps/enem-landing-account-web-e2e/test-output/playwright/report/
            apps/enem-landing-cms-e2e/test-output/playwright/report/
            apps/enem-landing-web-e2e/test-output/playwright/report/
          retention-days: 7
