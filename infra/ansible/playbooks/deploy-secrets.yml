---
# Inject GitHub Secrets sebagai Docker Swarm secrets di VPS. Ported
# verbatim (fully generic, no app-specific content) dari
# mau-apps/infra/ansible/playbooks/deploy-secrets.yml. Dipanggil terpisah
# dari `init-server.yml` (provisioning satu kali) - dijalankan tiap deploy
# dari GitHub Actions, diorkestrasi oleh `deploy.yml`.
#
# Usage:
#   ansible-playbook playbooks/deploy-secrets.yml -i <inventory> -l <host> \
#     -e @secrets-vars.yml
#
# secrets-vars.yml format:
#   swarm_secrets:
#     jwt_secret_account_api: "<value dari GitHub Secrets>"
#     ...
#
# Docker Swarm secret bersifat IMMUTABLE - tidak bisa di-update di tempat.
# Pola yang dipakai: nama secret asli = "<name>_<hash-8-char-dari-value>" -
# kalau value berubah, hash ikut berubah, otomatis jadi secret object baru
# (bukan overwrite/error). Service yang mereferensikan secret perlu
# di-update untuk pakai nama versi terbaru - bagian dari `docker stack
# deploy` (deploy.yml), bukan playbook ini. Secret versi lama TIDAK otomatis
# dihapus di sini - servicenya masih bisa pakai versi lama sampai
# di-redeploy, cleanup manual/terjadwal di luar scope story ini.

- name: "Inject GitHub Secrets sebagai Docker Swarm secrets"
  hosts: all
  become: true
  tasks:
    - name: Pastikan swarm_secrets sudah diisi
      ansible.builtin.assert:
        that:
          - swarm_secrets is defined
          - swarm_secrets | length > 0
        fail_msg: >-
          Variable 'swarm_secrets' wajib diisi (dict nama->value), lewat
          -e @secrets-vars.yml

    - name: Hitung nama versi tiap secret (hash 8 karakter dari value)
      no_log: true
      ansible.builtin.set_fact:
        swarm_secret_versions: "{{ swarm_secret_versions | default({}) | combine({item.key: item.key + '_' + (item.value | hash('sha256'))[:8]}) }}"
      loop: "{{ swarm_secrets | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    - name: Ambil daftar Docker Swarm secret yang sudah ada
      ansible.builtin.command: "docker secret ls --format '{{ '{{' }}.Name{{ '}}' }}'"
      register: existing_secrets
      changed_when: false

    - name: Tentukan secret versi yang belum ada (perlu dibuat)
      no_log: true
      ansible.builtin.set_fact:
        swarm_secrets_missing: "{{ swarm_secret_versions | dict2items | rejectattr('value', 'in', existing_secrets.stdout_lines) | list }}"

    - name: Laporkan berapa secret baru yang akan dibuat (nama saja, bukan value)
      ansible.builtin.debug:
        msg: "Secret baru yang akan dibuat: {{ swarm_secrets_missing | map(attribute='value') | list }}"

    - name: Tulis value secret ke temp file sementara (mode 600, bukan shell inline - hindari injection)
      no_log: true
      ansible.builtin.copy:
        content: "{{ swarm_secrets[item.key] }}"
        dest: "/tmp/.swarm_secret_{{ item.value }}"
        mode: "0600"
      loop: "{{ swarm_secrets_missing }}"
      loop_control:
        label: "{{ item.key }}"

    - name: Buat Docker Swarm secret dari temp file
      ansible.builtin.command: "docker secret create {{ item.value }} /tmp/.swarm_secret_{{ item.value }}"
      loop: "{{ swarm_secrets_missing }}"
      loop_control:
        label: "{{ item.key }}"

    - name: Hapus temp file setelah secret dibuat
      ansible.builtin.file:
        path: "/tmp/.swarm_secret_{{ item.value }}"
        state: absent
      loop: "{{ swarm_secrets_missing }}"
      loop_control:
        label: "{{ item.key }}"

    - name: Safety net - hapus temp file secret yang mungkin tersisa dari run gagal sebelumnya
      ansible.builtin.shell: "rm -f /tmp/.swarm_secret_*"
      changed_when: false
      when: swarm_secrets_missing | length > 0
