---
# Variable global untuk semua host/play - dibaca otomatis oleh Ansible
# terlepas dari inventory group, jadi konsisten dipakai di semua play
# init-server.yml. Ported dari mau-apps/infra/ansible/playbooks/group_vars/all.yml.

deploy_user: deploy

# Range IP resmi Cloudflare (IPv4 + IPv6) - dipakai Traefik
# `forwardedheaders.trustedips` supaya `CF-Connecting-IP`/`X-Forwarded-For`
# dari proxy Cloudflare dipercaya sebagai IP asli pengunjung. Daftar ini
# statis (jarang berubah), dari https://www.cloudflare.com/ips/ - cek ulang
# manual kalau ada laporan IP pengunjung yang salah setelah Cloudflare
# mengubah range mereka.
cloudflare_trusted_ips:
  - 173.245.48.0/20
  - 103.21.244.0/22
  - 103.22.200.0/22
  - 103.31.4.0/22
  - 141.101.64.0/18
  - 108.162.192.0/18
  - 190.93.240.0/20
  - 188.114.96.0/20
  - 197.234.240.0/22
  - 198.41.128.0/17
  - 162.158.0.0/15
  - 104.16.0.0/13
  - 104.24.0.0/14
  - 172.64.0.0/13
  - 131.0.72.0/22
  - 2400:cb00::/32
  - 2606:4700::/32
  - 2803:f800::/32
  - 2405:b500::/32
  - 2405:8100::/32
  - 2a06:98c0::/29
  - 2c0f:f248::/32
