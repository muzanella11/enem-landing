# PROD environment override for compose.yml (Story 10, issues/10-infra-cicd.md),
# ported from mau-apps/compose.prod.yml - same OOM-prevention approach,
# per explicit user direction: keep memory tuning identical to mau-apps
# ("Sama persis cara optimize nya dengan di mau apps agar tidak terjadi
# oom. Karna spek server di sini kecil").
#
# Used together with the base:
#   docker stack deploy -c compose.yml -c compose.prod.yml <stack-name>
#
# Budget (re-sized 2026-11-07 for the 3.6 GB / 2 vCPU VPS at 43.133.149.209,
# which also runs the dev stack and Traefik). The original 100M/60M-heap
# limits were sized for a small VPS; on the new host they caused the prod
# CMS to crash with "JavaScript heap out of memory" (Bad Gateway), while
# account-api and api were running at 85% and 74% of their 100M limit.
#   prod: 5 apps @ 256M (heap 160) + CMS @ 384M (heap 256) = 1664M
#   dev:  5 apps @ 192M (heap 120) + CMS @ 256M (heap 160) = 1216M
#   Traefik 64M -> ~2.9 GB of ceilings on a 3.6 GB host (+2 GB swap).
# These are ceilings, not reservations: actual use was ~0.7 GB in total.
# Re-check with `free -h` and `docker stats` before raising them further.
#
# `restart_policy.condition: on-failure` is already set via
# `x-deploy-defaults` in compose.yml - a container that exceeds its memory
# limit and gets OOM-killed restarts from there automatically, no need to
# repeat it here.
#
# Tuning (mirrors mau-apps' Story 2.4 finding): `NODE_OPTIONS:
# --max-old-space-size` per app, deliberately well below the container
# mem_limit - V8 heap is only part of a Node process's total memory (native
# addons/buffers/stack sit outside the heap), so the heap limit needs
# significant headroom below the container ceiling, not to sit flush
# against it. If a future workload here ever needs bulk-processing headroom
# the way mau-topup-api's IAK catalog sync did (see mau-apps' own comment
# for that incident), raise that one app's limit + heap together, keeping
# the same ~60-65% heap/ceiling ratio.
#
# compose.dev.yml has its own, lower limits (dev shares this VPS).

x-node-tuning: &node-tuning
  environment:
    NODE_OPTIONS: --max-old-space-size=160

services:
  # enem-landing-account-api doesn't use `<<: *node-tuning` (unlike the 4
  # Nuxt apps below) - same reason as mau-apps' NestJS services:
  # `environment:` needs NODE_OPTIONS alongside other keys explicitly, since
  # YAML's `<<:` merge key does NOT deep-merge a nested map - redeclaring
  # `environment:` at the same level REPLACES the anchor's contents rather
  # than merging into them (mau-apps found this the hard way wiring their
  # own Story 2.6; noted here so it isn't rediscovered).
  enem-landing-account-api:
    image: ghcr.io/muzanella11/enem-landing-account-api:prod
    environment:
      NODE_OPTIONS: --max-old-space-size=160
    deploy:
      resources:
        limits:
          memory: 256M
  enem-landing-account-web:
    image: ghcr.io/muzanella11/enem-landing-account-web:prod
    <<: *node-tuning
    deploy:
      resources:
        limits:
          memory: 256M
  enem-landing-api:
    image: ghcr.io/muzanella11/enem-landing-api:prod
    environment:
      NODE_OPTIONS: --max-old-space-size=160
    deploy:
      resources:
        limits:
          memory: 256M
  enem-landing-cms:
    image: ghcr.io/muzanella11/enem-landing-cms:prod
    # Raised from 60M heap / 100M limit on 2026-11-07: prod crashed twice with
    # "JavaScript heap out of memory" at ~58 MB heap (exit 139, Bad Gateway
    # on /tools). The VPS now has 3.6 GB RAM, so the old small-server budget
    # no longer applies. Same ~65% heap/ceiling ratio as the header explains.
    environment:
      NODE_OPTIONS: --max-old-space-size=256
    deploy:
      resources:
        limits:
          memory: 384M
  enem-landing-web:
    image: ghcr.io/muzanella11/enem-landing-web:prod
    # Not `<<: *node-tuning`: it would be replaced by this `environment:`
    # (no deep merge, see above), so NODE_OPTIONS is repeated here.
    environment:
      NODE_OPTIONS: --max-old-space-size=160
      # GA4 measurement id of property 563108458 (muzanella.com), prod only so dev
      # traffic never lands in the real reports (dev has its own property,
      # 320181329 muzanellacomdev). Empty = GA off.
      NUXT_PUBLIC_GA_MEASUREMENT_ID: G-BTFTCN7Y7D
    deploy:
      resources:
        limits:
          memory: 256M
  enem-landing-tools:
    image: ghcr.io/muzanella11/enem-landing-tools:prod
    # Not `<<: *node-tuning`: it would be replaced by this `environment:`
    # (no deep merge, see above), so NODE_OPTIONS is repeated here.
    environment:
      NODE_OPTIONS: --max-old-space-size=160
      # GA4 measurement id of property 563108458 (muzanella.com), prod only so dev
      # traffic never lands in the real reports (dev has its own property,
      # 320181329 muzanellacomdev). Empty = GA off.
      NUXT_PUBLIC_GA_MEASUREMENT_ID: G-BTFTCN7Y7D
    deploy:
      resources:
        limits:
          memory: 256M
